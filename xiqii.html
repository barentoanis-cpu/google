<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Interface</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top navigation */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            font-size: 14px;
        }

        .top-nav a {
            margin-left: 15px;
            text-decoration: none;
            color: #000;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }

        .search-box input {
            width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            background: #f2f2f2;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        .buttons button:hover {
            border: 1px solid #ccc;
        }

        /* Footer */
        footer {
            background: #f2f2f2;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
    </div>

    <!-- Main Section -->
    <div class="main">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span>
            <span>g</span><span>l</span><span>e</span>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search Google or type a URL">
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button>I’m Feeling Lucky</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Ethiopia | Simple Google UI Practice
    </footer>

</body>
</html>
