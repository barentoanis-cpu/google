<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Interface Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Google Logo */
        .logo {
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .logo span:nth-child(1){color:#4285F4;}
        .logo span:nth-child(2){color:#DB4437;}
        .logo span:nth-child(3){color:#F4B400;}
        .logo span:nth-child(4){color:#4285F4;}
        .logo span:nth-child(5){color:#0F9D58;}
        .logo span:nth-child(6){color:#DB4437;}

        /* Search Box */
        .search-box {
            width: 550px;
            max-width: 90%;
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 25px;
            padding: 10px 15px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }

        /* Apps */
        .apps {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            text-align: center;
        }

        .app {
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .icon {
            width: 50px;
            height: 50px;
            margin: auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .youtube { background: #FF0000; }
        .chrome { background: #4285F4; }
        .github { background: #24292e; }
        .gmail  { background: #DB4437; }
        .telegram { background: #0088cc; }
        .drive { background: #0F9D58; }

        .app p {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    


    <!-- Logo -->
    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <!-- Search -->
    <form class="search-box" onsubmit="searchGoogle(event)">
        <input type="text" id="query" placeholder="Search Google or type a URL">
    </form>

    <!-- Apps -->
    <div class="apps">
        <a class="app" href="https://www.youtube.com" target="_blank">
            <div class="icon youtube">▶</div>
            <p>YouTube</p>
        </a>

        <a class="app" href="https://www.google.com/chrome/" target="_blank">
            <div class="icon chrome">🌐</div>
            <p>Chrome</p>
        </a>

        <a class="app" href="https://github.com" target="_blank">
            <div class="icon github">🐙</div>
            <p>GitHub</p>
        </a>

        <a class="app" href="https://mail.google.com" target="_blank">
            <div class="icon gmail">✉</div>
            <p>Gmail</p>
        </a>

        <a class="app" href="https://web.telegram.org" target="_blank">
            <div class="icon telegram">✈</div>
            <p>Telegram</p>
        </a>

        <a class="app" href="https://drive.google.com" target="_blank">
            <div class="icon drive">📁</div>
            <p>Drive</p>
        </a>
    </div>

    <script>
        function searchGoogle(e) {
            e.preventDefault();
            const q = document.getElementById("query").value;
            if (q.trim() !== "") {
                window.location.href =
                    "https://www.google.com/search?q=" + encodeURIComponent(q);
            }
        }
    </script>

</body>
</html>
